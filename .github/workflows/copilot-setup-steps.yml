name: Agentic Workflow - Mona Info Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # S'exécute chaque jour à 9h

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Installer GitHub CLI Agentic Workflows
        uses: github/gh-aw/actions/setup-cli@v0.88.7
        with:
          version: v0.88.7
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Exécuter l'Agentic Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh aw run update-github-info --ref "${{ github.ref_name }}"