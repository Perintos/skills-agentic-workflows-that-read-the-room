name: Agentic Workflow - Mona Info Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # S'exécute chaque jour à 9h
  push:
    branches:
      - setup-agentic-workflows

permissions:
  actions: write
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer gh-aw
        uses: github/gh-aw/actions/setup-cli@main
        with:
          github-token: ${{ github.token }}
          version: latest

      - name: Compiler le workflow agentique
        run: gh aw compile .github/workflows/update-github-info.md --strict

      - name: Exécuter l'Agentic Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw run update-github-info