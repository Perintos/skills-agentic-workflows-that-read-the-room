name: Agentic Workflow - Mona Info Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # S'exécute chaque jour à 9h

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Installer l'extension GitHub CLI Agentic Workflows
        run: |
          gh extension install github/gh-aw || true
          gh extension upgrade github/gh-aw || true

      - name: Exécuter l'Agentic Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh aw run agentic-workflows
