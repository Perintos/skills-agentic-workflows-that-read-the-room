name: Agentic Workflow - Mona Info Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # S'exécute chaque jour à 9h

permissions:
  actions: write
  contents: write
  pull-requests: write
  workflows: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.88.7
        with:
          github-token: ${{ github.token }}
          version: v0.88.7

      - name: Exécuter l'Agentic Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw run update-github-info